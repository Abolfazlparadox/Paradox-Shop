components:
  schemas:
    ActivePromotion:
      type: object
      description: Public representation of an active promotion for storefront display.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: Unique identifier (UUID v4) for this record.
        name:
          type: string
          readOnly: true
          title: Promotion name
        slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        description:
          type: string
          readOnly: true
        discount_type:
          allOf:
          - $ref: '#/components/schemas/DiscountTypeEnum'
          readOnly: true
        discount_type_display:
          type: string
          readOnly: true
        discount_value:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,0})?$
          readOnly: true
          description: Percentage (0-100) when type is percentage, or fixed Rial amount
            when type is fixed_amount.
        max_discount_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,0})?$
          readOnly: true
          nullable: true
          title: Maximum discount amount (Rial)
          description: Caps the discount for percentage-type promotions.
        start_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        end_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - description
      - discount_type
      - discount_type_display
      - discount_value
      - end_at
      - id
      - max_discount_amount
      - name
      - slug
      - start_at
    AddCartItemRequest:
