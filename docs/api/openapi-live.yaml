    WishlistProduct:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: Unique identifier (UUID v4) for this record.
        name:
          type: string
          title: Product name
          maxLength: 255
        slug:
          type: string
          maxLength: 255
          pattern: ^[-a-zA-Z0-9_]+$
        base_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,0})?$
          title: Base price (Rial)
          description: Base product price in Iranian Rial without decimals.
        brand_name:
          type: string
          readOnly: true
        category_name:
          type: string
          readOnly: true
        images:
          type: array
          items:
            $ref: '#/components/schemas/WishlistProductImage'
          readOnly: true
        is_active:
          type: boolean
        is_featured:
          type: boolean
      required:
      - base_price
      - brand_name
      - category_name
      - id
      - images
      - name
      - slug
    WishlistProductImage:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: Unique identifier (UUID v4) for this record.
        image:
          type: string
          format: uri
          title: Image file
        alt_text:
          type: string
          nullable: true
          title: Alternative text
          maxLength: 255
        sort_order:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        is_primary:
          type: boolean
          title: Is primary image
      required:
      - id
      - image
    WishlistVariant:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: Unique identifier (UUID v4) for this record.
        sku:
          type: string
          maxLength: 100
        name:
          type: string
          title: Variant name
          description: e.g., Red / 128GB
          maxLength: 255
        price_override:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,0})?$
          nullable: true
          title: Price override (Rial)
          description: Overrides base product price if specified.
        stock:
          type: integer
          maximum: 2147483647
          minimum: 0
          title: Stock inventory
        is_active:
          type: boolean
      required:
      - id
      - name
      - sku
