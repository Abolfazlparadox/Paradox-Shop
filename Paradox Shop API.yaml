          description: Unique identifier (UUID v4) for this record.
        order:
          type: string
          format: uuid
          description: Unique identifier (UUID v4) for this record.
          readOnly: true
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,0})?$
          readOnly: true
          title: Amount (Rial)
          description: Payment amount in Iranian Rial.
        status:
          allOf:
          - $ref: '#/components/schemas/PaymentStatusEnum'
          readOnly: true
        payment_method:
          allOf:
          - $ref: '#/components/schemas/PaymentMethodEnum'
          readOnly: true
        gateway:
          type: string
          readOnly: true
          nullable: true
          title: Payment gateway
          description: e.g., zarinpal, pasargad
        transaction_id:
          type: string
          readOnly: true
          nullable: true
        idempotency_key:
          type: string
          readOnly: true
          nullable: true
          description: Unique key supplied by client to prevent duplicate payment
            submissions.
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - amount
      - created_at
      - gateway
      - id
      - idempotency_key
      - order
      - payment_method
      - status
      - transaction_id
      - updated_at
    PaymentMethodEnum:
      enum:
      - online
      - wallet
      - cod
      type: string
      description: |-
        * `online` - Online Gateway
        * `wallet` - User Wallet
        * `cod` - Cash on Delivery
    PaymentStatusEnum:
      enum:
      - pending
      - processing
      - succeeded
      - failed
      - refunded
      type: string
      description: |-
        * `pending` - Pending
        * `processing` - Processing
        * `succeeded` - Succeeded
        * `failed` - Failed
        * `refunded` - Refunded
    ProductAttributeValue:
      type: object
      description: Serializer exposing a Product's concrete value for a Category-defined
        dynamic attribute.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: Unique identifier (UUID v4) for this record.
        attribute_id:
          type: string
          format: uuid
          readOnly: true
        attribute_name:
          type: string
          readOnly: true
        attribute_type:
          type: string
          readOnly: true
        value:
          oneOf:
          - type: string
          - type: number
          - type: boolean
          nullable: true
          readOnly: true
      required:
      - attribute_id
      - attribute_name
      - attribute_type
      - id
      - value
    ProductDetail:
      type: object
      description: Full Product representation including brand, category, images,
        variants and attributes.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: Unique identifier (UUID v4) for this record.
        name:
          type: string
          title: Product name
          maxLength: 255
        slug:
          type: string
          maxLength: 255
          pattern: ^[-a-zA-Z0-9_]+$
        description:
          type: string
        short_description:
          type: string
          nullable: true
          maxLength: 500
        base_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,0})?$
          title: Base price (Rial)
          description: Base product price in Iranian Rial without decimals.
        product_type:
          $ref: '#/components/schemas/ProductTypeEnum'
        is_active:
          type: boolean
        is_featured:
          type: boolean
        brand:
          allOf:
          - $ref: '#/components/schemas/Brand'
          readOnly: true
        category:
          allOf:
          - $ref: '#/components/schemas/CategoryMini'
          readOnly: true
        images:
          type: array
          items:
            $ref: '#/components/schemas/ProductImage'
          readOnly: true
        variants:
          type: array
          items:
            $ref: '#/components/schemas/ProductVariant'
          readOnly: true
        attribute_values:
          type: array
          items:
            $ref: '#/components/schemas/ProductAttributeValue'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - attribute_values
      - base_price
      - brand
      - category
      - created_at
      - description
      - id
      - images
      - name
      - slug
      - variants
    ProductImage:
      type: object
      description: Serializer for a Product's gallery images.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: Unique identifier (UUID v4) for this record.
        image:
          type: string
          format: uri
          title: Image file
        alt_text:
          type: string
          nullable: true
          title: Alternative text
          maxLength: 255
        sort_order:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        is_primary:
          type: boolean
          title: Is primary image
        variant:
          type: string
          format: uuid
          description: Unique identifier (UUID v4) for this record.
          nullable: true
          title: Product variant
      required:
      - id
      - image
    ProductList:
      type: object
      description: Lightweight Product representation for the paginated catalog listing
        endpoint.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: Unique identifier (UUID v4) for this record.
        name:
          type: string
          title: Product name
          maxLength: 255
        slug:
          type: string
          maxLength: 255
          pattern: ^[-a-zA-Z0-9_]+$
        short_description:
          type: string
          nullable: true
          maxLength: 500
        base_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,0})?$
          title: Base price (Rial)
          description: Base product price in Iranian Rial without decimals.
        product_type:
          $ref: '#/components/schemas/ProductTypeEnum'
        is_featured:
          type: boolean
        brand:
          allOf:
          - $ref: '#/components/schemas/Brand'
          readOnly: true
        category:
          allOf:
          - $ref: '#/components/schemas/CategoryMini'
          readOnly: true
        primary_image:
          type: string
          format: uri
          nullable: true
          readOnly: true
      required:
      - base_price
      - brand
      - category
      - id
      - name
      - primary_image
      - slug
    ProductTypeEnum:
      enum:
      - simple
      - variable
      - digital
      type: string
      description: |-
        * `simple` - Simple Product
        * `variable` - Variable Product
        * `digital` - Digital Product
    ProductVariant:
      type: object
      description: Serializer for a Product's purchasable SKU/variant.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: Unique identifier (UUID v4) for this record.
        sku:
          type: string
          maxLength: 100
        name:
          type: string
          title: Variant name
          description: e.g., Red / 128GB
          maxLength: 255
        price_override:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,0})?$
          nullable: true
          title: Price override (Rial)
          description: Overrides base product price if specified.
        final_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,0})?$
          readOnly: true
        stock:
          type: integer
          maximum: 2147483647
          minimum: 0
          title: Stock inventory
        is_active:
          type: boolean
        attributes:
          title: Variant attributes
          description: JSON dictionary of specific variant attribute key-value pairs.
      required:
      - final_price
      - id
      - name
      - sku
    Review:
      type: object
      description: Serializer for a public Review representation.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: Unique identifier (UUID v4) for this record.
        product:
          type: string
          format: uuid
          description: Unique identifier (UUID v4) for this record.
          readOnly: true
        user_display_name:
          type: string
          description: |-
            Returns a privacy-safe display name for the reviewer.
            Uses the user's full name if available, otherwise returns 'Anonymous'.
            The user's email is never exposed on the public review endpoint.
          readOnly: true
        rating:
          type: integer
          readOnly: true
          title: Rating (1-5)
        title:
          type: string
          readOnly: true
          nullable: true
          title: Review title
        body:
          type: string
          readOnly: true
          nullable: true
          title: Review body
        is_verified_purchase:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - body
      - created_at
      - id
      - is_verified_purchase
      - product
      - rating
      - title
      - updated_at
      - user_display_name
    StatusC20Enum:
      enum:
      - pending
      - processing
      - shipped
      - delivered
      - cancelled
      - refunded
      type: string
      description: |-
        * `pending` - Pending Payment
        * `processing` - Processing
        * `shipped` - Shipped
        * `delivered` - Delivered
        * `cancelled` - Cancelled
        * `refunded` - Refunded
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    TokenRefreshRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
    UserProfile:
      type: object
      description: Represents the authenticated user's account together with their
        profile.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: Unique identifier (UUID v4) for this record.
        email:
          type: string
          format: email
          readOnly: true
          title: Email address
        full_name:
          type: string
          readOnly: true
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        phone_number:
          type: string
          nullable: true
          maxLength: 20
        profile:
          $ref: '#/components/schemas/UserProfileDetail'
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - email
      - full_name
      - id
    UserProfileDetail:
      type: object
      description: Serializer for the UserProfile model, nested inside UserProfileSerializer.
      properties:
        avatar:
          type: string
          format: uri
          nullable: true
        national_id:
          type: string
          nullable: true
          maxLength: 10
        date_of_birth:
          type: string
          format: date
          nullable: true
        gender:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/GenderEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        email_verified:
          type: boolean
          readOnly: true
        phone_verified:
          type: boolean
          readOnly: true
      required:
      - email_verified
      - phone_verified
    UserProfileDetailRequest:
      type: object
      description: Serializer for the UserProfile model, nested inside UserProfileSerializer.
      properties:
        avatar:
          type: string
          format: binary
          nullable: true
        national_id:
          type: string
          nullable: true
          maxLength: 10
        date_of_birth:
          type: string
          format: date
          nullable: true
        gender:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/GenderEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
    UserProfileRequest:
      type: object
      description: Represents the authenticated user's account together with their
        profile.
      properties:
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        phone_number:
          type: string
          nullable: true
          maxLength: 20
        profile:
          $ref: '#/components/schemas/UserProfileDetailRequest'
    UserRegistration:
      type: object
      description: Validates and creates a new User account.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: Unique identifier (UUID v4) for this record.
        email:
          type: string
          format: email
          title: Email address
          maxLength: 255
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        phone_number:
          type: string
          nullable: true
          maxLength: 20
      required:
      - email
      - id
    UserRegistrationRequest:
      type: object
      description: Validates and creates a new User account.
      properties:
        email:
          type: string
          format: email
          minLength: 1
          title: Email address
          maxLength: 255
        password:
          type: string
          writeOnly: true
          minLength: 1
        password_confirm:
          type: string
          writeOnly: true
          minLength: 1
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        phone_number:
          type: string
          nullable: true
          maxLength: 20
      required:
      - email
      - password
      - password_confirm
  securitySchemes:
    bearerAuth:
      type: http
