          pattern: ^[-a-zA-Z0-9_]+$
    PatchedAdminCouponRequest:
      type: object
      description: Full coupon representation for admin CRUD operations.
      properties:
        code:
          type: string
          minLength: 1
          title: Coupon code
          description: Unique coupon code. Stored and compared in uppercase.
          maxLength: 50
        description:
          type: string
        discount_type:
          $ref: '#/components/schemas/DiscountTypeEnum'
        discount_value:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,0})?$
          description: Percentage (0-100) when type is percentage, or fixed Rial amount
            when type is fixed_amount.
        max_discount_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,0})?$
          nullable: true
          title: Maximum discount amount (Rial)
          description: Caps the discount for percentage-type coupons.
        min_order_subtotal:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,0})?$
          title: Minimum order subtotal (Rial)
          description: Order subtotal must meet this threshold for the coupon to apply.
        start_at:
          type: string
          format: date-time
          nullable: true
        end_at:
          type: string
          format: date-time
          nullable: true
        is_active:
          type: boolean
        total_usage_limit:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
          description: Maximum total redemptions. Null = unlimited.
        per_user_usage_limit:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: Maximum redemptions per user.
        audience_type:
          $ref: '#/components/schemas/AudienceTypeEnum'
        eligible_users:
          type: array
          items:
            type: string
            format: uuid
            description: Unique identifier (UUID v4) for this record.
        included_products:
          type: array
          items:
            type: string
            format: uuid
            description: Unique identifier (UUID v4) for this record.
        excluded_products:
          type: array
          items:
            type: string
            format: uuid
            description: Unique identifier (UUID v4) for this record.
        included_categories:
          type: array
          items:
            type: string
            format: uuid
            description: Unique identifier (UUID v4) for this record.
        included_brands:
          type: array
          items:
            type: string
            format: uuid
            description: Unique identifier (UUID v4) for this record.
