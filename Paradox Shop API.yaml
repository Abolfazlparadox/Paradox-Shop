openapi: 3.0.3
info:
  title: Paradox Shop API
  version: 1.0.0
  description: Official API documentation for the Paradox Shop platform.
paths:
  /api/v1/cart/:
    get:
      operationId: v1_cart_retrieve
      description: Returns the current Cart (authenticated user's or guest session's)
        with its items.
      tags:
      - Cart
      security:
      - jwtAuth: []
      - cookieAuth: []
      - bearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
          description: ''
  /api/v1/cart/items/:
    post:
      operationId: v1_cart_items_create
      description: Adds an item to the current Cart.
      tags:
      - Cart
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddCartItemRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AddCartItemRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AddCartItemRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - bearerAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
          description: ''
  /api/v1/cart/items/{item_id}/:
    patch:
      operationId: v1_cart_items_partial_update
      description: Updates the quantity of, or removes, a single Cart item belonging
        to the current Cart.
      parameters:
      - in: path
        name: item_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Cart
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUpdateCartItemRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUpdateCartItemRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUpdateCartItemRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      - bearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
          description: ''
    delete:
      operationId: v1_cart_items_destroy
      description: Updates the quantity of, or removes, a single Cart item belonging
        to the current Cart.
      parameters:
      - in: path
        name: item_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Cart
      security:
      - jwtAuth: []
      - cookieAuth: []
      - bearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
          description: ''
  /api/v1/cart/merge/:
    post:
      operationId: v1_cart_merge_create
      description: Merges a guest session Cart into the authenticated user's Cart.
        Requires authentication.
      tags:
      - Cart
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MergeCartRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MergeCartRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MergeCartRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
          description: ''
  /api/v1/categories/:
    get:
      operationId: v1_categories_list
      description: Returns a flat, paginated listing of active categories.
      parameters:
      - in: query
        name: is_root
        schema:
          type: boolean
        description: Filter root-level categories only (true/false)
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: parent
        schema:
          type: string
        description: Filter direct children of parent category slug
      tags:
      - Categories
      security:
      - jwtAuth: []
      - cookieAuth: []
      - bearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCategoryListList'
          description: ''
  /api/v1/categories/{slug}/:
    get:
      operationId: v1_categories_retrieve
      description: Returns a single Category with its parent, direct children and
        dynamic attributes.
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - Categories
      security:
      - jwtAuth: []
      - cookieAuth: []
      - bearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryDetail'
          description: ''
  /api/v1/categories/tree/:
    get:
      operationId: v1_categories_tree_list
      description: Returns the full active category hierarchy as a nested tree.
      tags:
      - Categories
      security:
      - jwtAuth: []
      - cookieAuth: []
      - bearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryTreeNode'
          description: ''
  /api/v1/health/:
    get:
      operationId: v1_health_retrieve
      description: Backwards-compatible full system health check endpoint.
      tags:
      - Health
      security:
      - bearerAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/health/live/:
    get:
      operationId: v1_health_live_retrieve
      description: |-
        Lightweight liveness probe.
        Returns 200 OK as long as the application process is running and responding.
      tags:
      - Health
      security:
      - bearerAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/health/ready/:
    get:
      operationId: v1_health_ready_retrieve
      description: |-
        Readiness probe verifying DB and Redis dependencies.
        Returns 200 OK when ready to accept traffic, 503 if any dependency fails.
      tags:
      - Health
      security:
      - bearerAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/orders/:
    get:
      operationId: v1_orders_list
      description: Lists the authenticated user's orders, newest first.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - Orders
      security:
      - jwtAuth: []
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOrderListList'
          description: ''
  /api/v1/orders/{id}/:
    get:
      operationId: v1_orders_retrieve
      description: Retrieves a single Order belonging to the authenticated user.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Orders
      security:
      - jwtAuth: []
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetail'
          description: ''
  /api/v1/orders/{id}/cancel/:
    post:
      operationId: v1_orders_cancel_create
      description: Cancels a pending or processing Order belonging to the authenticated
        user and restores stock.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Orders
      security:
      - jwtAuth: []
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetail'
          description: ''
  /api/v1/orders/checkout/:
    post:
      operationId: v1_orders_checkout_create
      description: |-
        Initiates checkout from the authenticated user's current cart.

        Validates:
        - Cart is not empty
        - Address belongs to the user
        - Sufficient stock for all variants

        Creates Order, OrderItems, OrderAddress, decrements stock, clears cart — all atomically.
      tags:
      - Orders
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetail'
          description: ''
  /api/v1/orders/health/:
    get:
      operationId: v1_orders_health_retrieve
      description: Module health check endpoint.
      tags:
      - Orders
      security:
      - jwtAuth: []
      - cookieAuth: []
      - bearerAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/payments/:
    get:
      operationId: v1_payments_list
      description: Lists all Payments for the authenticated user's orders.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - Payments
      security:
      - jwtAuth: []
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPaymentList'
          description: ''
  /api/v1/payments/{id}/:
    get:
      operationId: v1_payments_retrieve
      description: Retrieves a single Payment record belonging to the authenticated
        user.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Payments
      security:
      - jwtAuth: []
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
          description: ''
  /api/v1/payments/health/:
    get:
      operationId: v1_payments_health_retrieve
      description: Module health check endpoint.
      tags:
      - Payments
      security:
      - jwtAuth: []
      - cookieAuth: []
      - bearerAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/payments/pay/:
    post:
      operationId: v1_payments_pay_create
      description: |-
        Initiates a mock payment for one of the authenticated user's eligible orders.

        The order must be in 'pending' status to be eligible.
        Supports idempotency_key to safely prevent duplicate payment attempts.
      tags:
      - Payments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreatePaymentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreatePaymentRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
          description: ''
  /api/v1/products/:
    get:
      operationId: v1_products_list
      description: |-
        Returns a paginated, filterable Product catalog listing.

        Supported query params:
            category      - filter by Category slug
            brand         - filter by Brand slug
            is_featured   - filter by featured flag (true/false)
            min_price     - minimum base_price (inclusive)
            max_price     - maximum base_price (inclusive)
            search        - case-insensitive match against name / short_description
      parameters:
      - in: query
        name: brand
        schema:
          type: string
        description: Filter by Brand slug
      - in: query
        name: category
        schema:
          type: string
        description: Filter by Category slug
      - in: query
        name: is_featured
        schema:
          type: boolean
        description: Filter by featured flag (true/false)
      - in: query
        name: max_price
        schema:
          type: integer
        description: Maximum base price (inclusive)
      - in: query
        name: min_price
        schema:
          type: integer
        description: Minimum base price (inclusive)
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
        description: Search term in name or description
      tags:
      - Products
      security:
      - jwtAuth: []
      - cookieAuth: []
      - bearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProductListList'
          description: ''
  /api/v1/products/{slug}/:
    get:
      operationId: v1_products_retrieve
      description: Returns a single Product with its brand, category, images, variants
        and attribute values.
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - Products
      security:
      - jwtAuth: []
      - cookieAuth: []
      - bearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetail'
          description: ''
  /api/v1/reviews/create/:
    post:
      operationId: v1_reviews_create_create
      description: |-
        Submits a new product Review by an authenticated user.

        The user must have purchased the product in a paid (delivered) order.
        Only one review per product per user is allowed.
        New reviews are set to is_approved=False (pending moderation).
      tags:
      - Reviews
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReviewRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateReviewRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateReviewRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
          description: ''
  /api/v1/reviews/health/:
    get:
      operationId: v1_reviews_health_retrieve
      description: Module health check endpoint.
      tags:
      - Reviews
      security:
      - jwtAuth: []
      - cookieAuth: []
      - bearerAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/reviews/product/{product_id}/:
    get:
      operationId: v1_reviews_product_list
      description: Lists approved (public) reviews for a specific product.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: path
        name: product_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Reviews
      security:
      - jwtAuth: []
      - cookieAuth: []
      - bearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedReviewList'
          description: ''
  /api/v1/users/addresses/:
    get:
      operationId: v1_users_addresses_list
      description: CRUD endpoints for the authenticated user's address book.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - Users
      security:
      - jwtAuth: []
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAddressList'
          description: ''
    post:
      operationId: v1_users_addresses_create
      description: CRUD endpoints for the authenticated user's address book.
      tags:
      - Users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AddressRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AddressRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
          description: ''
  /api/v1/users/addresses/{id}/:
    get:
      operationId: v1_users_addresses_retrieve
      description: CRUD endpoints for the authenticated user's address book.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
          description: Unique identifier (UUID v4) for this record.
        required: true
      tags:
      - Users
      security:
      - jwtAuth: []
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
          description: ''
    put:
      operationId: v1_users_addresses_update
      description: CRUD endpoints for the authenticated user's address book.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
          description: Unique identifier (UUID v4) for this record.
        required: true
      tags:
      - Users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AddressRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AddressRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
          description: ''
    patch:
      operationId: v1_users_addresses_partial_update
      description: CRUD endpoints for the authenticated user's address book.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
          description: Unique identifier (UUID v4) for this record.
        required: true
      tags:
      - Users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAddressRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAddressRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAddressRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
          description: ''
    delete:
      operationId: v1_users_addresses_destroy
      description: CRUD endpoints for the authenticated user's address book.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
          description: Unique identifier (UUID v4) for this record.
        required: true
      tags:
      - Users
      security:
      - jwtAuth: []
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/users/login/:
    post:
      operationId: v1_users_login_create
      description: Authenticates a user with email/password credentials and issues
        JWT tokens.
      tags:
      - Users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailTokenObtainPairRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmailTokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailTokenObtainPairRequest'
        required: true
      security:
      - bearerAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/users/login/refresh/:
    post:
      operationId: v1_users_login_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/users/logout/:
    post:
      operationId: v1_users_logout_create
      description: Blacklists the provided refresh token to log the user out.
      tags:
      - Users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Logout'
          description: ''
  /api/v1/users/password/change/:
    post:
      operationId: v1_users_password_change_create
      description: Changes the authenticated user's password.
      tags:
      - Users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/users/profile/:
    get:
      operationId: v1_users_profile_retrieve
      description: Retrieves or partially/fully updates the authenticated user's account
        and profile.
      tags:
      - Users
      security:
      - jwtAuth: []
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
    put:
      operationId: v1_users_profile_update
      description: Retrieves or partially/fully updates the authenticated user's account
        and profile.
      tags:
      - Users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserProfileRequest'
          application/x-www-form-urlencoded:
            schema:
