      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminCoupon'
          description: ''
    post:
      operationId: v1_admin_coupons_create
      description: List all coupons or create a new one.
      tags:
      - Admin - Coupons
      requestBody:
        content:
          application/json:
