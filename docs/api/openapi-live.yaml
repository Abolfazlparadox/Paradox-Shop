      description: Retrieve, update, or delete a coupon.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Admin - Coupons
      security:
      - jwtAuth: []
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/admin/coupons/{id}/toggle/:
    post:
