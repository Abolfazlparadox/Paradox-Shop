          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminModerationActionRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCommentList'
          description: ''
  /api/v1/admin/comments/{id}/reply/:
    post:
