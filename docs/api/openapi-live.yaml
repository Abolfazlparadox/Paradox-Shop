      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Admin - Moderation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCommentReplyCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminCommentReplyCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminCommentReplyCreateRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCommentList'
          description: ''
  /api/v1/admin/coupons/:
