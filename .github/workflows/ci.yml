name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-test:
    name: Backend Test Suite & Quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: shop_db_test
          POSTGRES_USER: shop_user
          POSTGRES_PASSWORD: shop_password_secure_123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: curl -sSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies (including dev tools)
        run: |
          cd backend
          uv pip install --system --group dev -e .

      - name: Django Migration Consistency Check
        env:
          POSTGRES_DB: shop_db_test
          POSTGRES_USER: shop_user
          POSTGRES_PASSWORD: shop_password_secure_123
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          REDIS_URL: redis://localhost:6379/0
          DJANGO_SECRET_KEY: ci-test-secret-key
          DJANGO_DEBUG: True
        run: |
          cd backend
          python manage.py makemigrations --check --dry-run

      - name: Django System Check
        env:
          POSTGRES_DB: shop_db_test
          POSTGRES_USER: shop_user
          POSTGRES_PASSWORD: shop_password_secure_123
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          REDIS_URL: redis://localhost:6379/0
          DJANGO_SECRET_KEY: ci-test-secret-key
          DJANGO_DEBUG: True
        run: |
          cd backend
          python manage.py check

      - name: Code Formatting & Linting Check
        run: |
          cd backend
          black --check config apps common tests
          flake8 config apps common tests

      - name: Run Backend Tests with Coverage
        env:
          POSTGRES_DB: shop_db_test
          POSTGRES_USER: shop_user
          POSTGRES_PASSWORD: shop_password_secure_123
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          REDIS_URL: redis://localhost:6379/0
          DJANGO_SECRET_KEY: ci-test-secret-key
          DJANGO_DEBUG: True
        run: |
          cd backend
          pytest --cov=apps --cov=common --cov-report=term-missing

  frontend-check:
    name: Frontend Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Type Check
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Lint
        run: |
          cd frontend
          npm run lint
