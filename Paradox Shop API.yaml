components:
  schemas:
    AddCartItemRequest:
      type: object
      description: Validates the payload for adding an item to the Cart.
      properties:
        product_id:
          type: string
          format: uuid
        variant_id:
          type: string
          format: uuid
          nullable: true
        quantity:
          type: integer
          minimum: 1
          default: 1
      required:
      - product_id
    Address:
      type: object
      description: Serializer for a User's shipping/billing Address.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: Unique identifier (UUID v4) for this record.
        title:
          type: string
          description: e.g. Home, Work
          maxLength: 100
        recipient_name:
          type: string
          maxLength: 200
        recipient_phone:
          type: string
          maxLength: 20
        province:
          type: string
          maxLength: 100
        city:
          type: string
          maxLength: 100
        postal_code:
          type: string
          maxLength: 20
        address_line:
          type: string
        is_default:
          type: boolean
          title: Is Default Address
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - address_line
      - city
      - created_at
      - id
      - postal_code
      - province
      - recipient_name
      - recipient_phone
      - title
      - updated_at
    AddressRequest:
      type: object
      description: Serializer for a User's shipping/billing Address.
      properties:
        title:
          type: string
          minLength: 1
          description: e.g. Home, Work
          maxLength: 100
        recipient_name:
          type: string
          minLength: 1
          maxLength: 200
        recipient_phone:
          type: string
          minLength: 1
          maxLength: 20
        province:
          type: string
          minLength: 1
          maxLength: 100
        city:
          type: string
          minLength: 1
          maxLength: 100
        postal_code:
          type: string
          minLength: 1
          maxLength: 20
        address_line:
          type: string
          minLength: 1
        is_default:
          type: boolean
          title: Is Default Address
      required:
      - address_line
      - city
      - postal_code
      - province
      - recipient_name
      - recipient_phone
      - title
    AttributeTypeEnum:
      enum:
      - text
      - number
      - boolean
      - select
      type: string
      description: |-
        * `text` - Text
        * `number` - Number
        * `boolean` - Boolean
        * `select` - Select
    BlankEnum:
      enum:
      - ''
    Brand:
      type: object
      description: Lightweight Brand representation embedded in Product responses.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: Unique identifier (UUID v4) for this record.
        name:
          type: string
          title: Brand name
          maxLength: 255
        slug:
          type: string
          maxLength: 255
          pattern: ^[-a-zA-Z0-9_]+$
        logo:
          type: string
          format: uri
          nullable: true
      required:
      - id
      - name
      - slug
    Cart:
      type: object
      description: Serializer representing the full Cart with its line items and computed
        totals.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: Unique identifier (UUID v4) for this record.
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
          readOnly: true
        items_count:
          type: integer
          readOnly: true
        subtotal:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - items
      - items_count
      - subtotal
      - updated_at
    CartItem:
      type: object
      description: Serializer representing a single line item inside the Cart.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: Unique identifier (UUID v4) for this record.
        product:
          allOf:
          - $ref: '#/components/schemas/CartItemProduct'
          readOnly: true
        variant:
          allOf:
          - $ref: '#/components/schemas/CartItemVariant'
          readOnly: true
          nullable: true
        quantity:
          type: integer
          maximum: 2147483647
          minimum: 0
        unit_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,0})?$
          readOnly: true
          title: Unit price (Rial)
          description: Price snapshot in Iranian Rial at time of adding to cart.
        total_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,0})?$
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - product
      - total_price
      - unit_price
      - variant
    CartItemProduct:
      type: object
      description: Minimal Product snapshot embedded inside a CartItem representation.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        is_active:
          type: boolean
      required:
      - id
      - is_active
      - name
      - slug
    CartItemVariant:
      type: object
      description: Minimal ProductVariant snapshot embedded inside a CartItem representation.
      properties:
        id:
          type: string
          format: uuid
        sku:
          type: string
        name:
          type: string
        stock:
          type: integer
        is_active:
          type: boolean
      required:
      - id
      - is_active
      - name
      - sku
      - stock
    CategoryAttribute:
      type: object
      description: Serializer for a Category's dynamic attribute definitions.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: Unique identifier (UUID v4) for this record.
        name:
          type: string
          title: Attribute name
          maxLength: 255
        attribute_type:
          $ref: '#/components/schemas/AttributeTypeEnum'
        is_required:
          type: boolean
        is_filterable:
          type: boolean
          description: Used for search/catalog filters
        is_variant:
          type: boolean
          description: Used to define product SKUs/variants
        sort_order:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
      required:
      - id
      - name
    CategoryDetail:
      type: object
      description: Full Category representation including parent, direct children
        and dynamic attributes.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: Unique identifier (UUID v4) for this record.
        name:
          type: string
          maxLength: 255
        slug:
          type: string
          maxLength: 255
          pattern: ^[-a-zA-Z0-9_]+$
        description:
          type: string
          nullable: true
        image:
          type: string
          format: uri
          nullable: true
        parent:
          allOf:
          - $ref: '#/components/schemas/CategoryMini'
          readOnly: true
        children:
          type: array
          items:
            $ref: '#/components/schemas/CategoryMini'
          readOnly: true
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/CategoryAttribute'
          readOnly: true
        sort_order:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - attributes
      - children
      - created_at
      - id
      - name
      - parent
      - slug
    CategoryList:
      type: object
      description: Serializer for the flat, paginated Category listing endpoint.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: Unique identifier (UUID v4) for this record.
        name:
          type: string
          maxLength: 255
        slug:
          type: string
          maxLength: 255
          pattern: ^[-a-zA-Z0-9_]+$
        parent:
          type: string
          format: uuid
          description: Unique identifier (UUID v4) for this record.
          readOnly: true
        image:
          type: string
          format: uri
          nullable: true
        sort_order:
          type: integer
          maximum: 2147483647
