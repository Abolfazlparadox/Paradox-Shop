openapi: 3.0.3
info:
  title: Paradox Shop API
  version: 1.0.0
  description: Official API documentation for the Paradox Shop platform.
paths:
  /api/v1/admin/activity/:
    get:
      operationId: v1_admin_activity_list
      description: Immutable audit trail of administrative operations.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - Admin - Audit
      security:
      - jwtAuth: []
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminAuditLogList'
          description: ''
  /api/v1/admin/analytics/:
    get:
      operationId: v1_admin_analytics_retrieve
      description: Deep commerce, financial analytics, cohort matrix, and unit economics.
      parameters:
      - in: query
        name: days
        schema:
          type: integer
        description: 'Number of lookback days (default: 30)'
      tags:
      - Admin - Telemetry
      security:
      - jwtAuth: []
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAnalyticsResponse'
          description: ''
  /api/v1/admin/categories/:
    get:
      operationId: v1_admin_categories_list
      description: Lists categories or registers a new category.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - Admin - Categories
      security:
      - jwtAuth: []
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminCategorySummaryList'
          description: ''
    post:
      operationId: v1_admin_categories_create
      description: Lists categories or registers a new category.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - Admin - Categories
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCategorySummaryRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminCategorySummaryRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminCategorySummaryRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminCategorySummaryList'
          description: ''
  /api/v1/admin/categories/{id}/:
    get:
      operationId: v1_admin_categories_retrieve
      description: Inspects, updates, or deletes a category.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Admin - Categories
      security:
      - jwtAuth: []
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCategorySummary'
          description: ''
    put:
      operationId: v1_admin_categories_update
      description: Inspects, updates, or deletes a category.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Admin - Categories
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCategorySummaryRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminCategorySummaryRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminCategorySummaryRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCategorySummary'
          description: ''
    patch:
      operationId: v1_admin_categories_partial_update
      description: Inspects, updates, or deletes a category.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Admin - Categories
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAdminCategorySummaryRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAdminCategorySummaryRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAdminCategorySummaryRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCategorySummary'
          description: ''
    delete:
      operationId: v1_admin_categories_destroy
      description: Inspects, updates, or deletes a category.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Admin - Categories
      security:
      - jwtAuth: []
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCategorySummary'
          description: ''
  /api/v1/admin/comments/:
    get:
      operationId: v1_admin_comments_list
      description: Threaded product inquiries and technical discussion queue.
      parameters:
      - in: query
        name: is_approved
        schema:
          type: boolean
        description: Filter approved/pending (true/false)
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
        description: Search comment text, author
      tags:
      - Admin - Moderation
      security:
      - jwtAuth: []
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminCommentListList'
          description: ''
  /api/v1/admin/comments/{id}/moderate/:
    post:
      operationId: v1_admin_comments_moderate_create
