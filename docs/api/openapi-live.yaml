    Payment:
      type: object
      description: Serializer for a Payment record.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: Unique identifier (UUID v4) for this record.
        order:
          type: string
          format: uuid
          description: Unique identifier (UUID v4) for this record.
          readOnly: true
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,0})?$
          readOnly: true
          title: Amount (Rial)
          description: Payment amount in Iranian Rial.
        status:
          allOf:
          - $ref: '#/components/schemas/Status9f3Enum'
          readOnly: true
        payment_method:
          allOf:
          - $ref: '#/components/schemas/PaymentMethodEnum'
          readOnly: true
        gateway:
          type: string
          readOnly: true
          nullable: true
          title: Payment gateway
          description: e.g., zarinpal, pasargad
        transaction_id:
          type: string
          readOnly: true
          nullable: true
        idempotency_key:
          type: string
          readOnly: true
          nullable: true
          description: Unique key supplied by client to prevent duplicate payment
            submissions.
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - amount
      - created_at
      - gateway
      - id
      - idempotency_key
      - order
      - payment_method
      - status
      - transaction_id
      - updated_at
    PaymentMethodEnum:
      enum:
      - online
      - wallet
      - cod
      type: string
